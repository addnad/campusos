packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 replaced onlyBuiltDependencies / ignoredBuiltDependencies
# with allowBuilds. Both ship prebuilt binaries, so neither needs to build.
allowBuilds:
  sharp: false
  unrs-resolver: false
  # Prisma's postinstall generates the client. This one must run.
  "@prisma/client": true
  prisma: true
  "@prisma/engines": true
